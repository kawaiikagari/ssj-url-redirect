<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SSJ Staff Calendar - Perfect Fit</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        .scale-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        iframe {
            width: 60.6%;
            height: 60.6%;
            transform: scale(1.65);
            transform-origin: top left;
            border: none;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="scale-wrapper">
        <iframe src="https://calendar.google.com/calendar/embed?wkst=1&ctz=Asia%2FTokyo&showPrint=0&color=%2342d692&color=%23cd74e6&color=%23f83a22&src=10bbcc5e95ad3ebc84ca5245eabc6a817e21cc54898d0ebe61a9ea202e38442a@group.calendar.google.com&src=af7b89fce476be7722a861547e3ff97399c9035ea2695e2013e3fec631902cad@group.calendar.google.com&src=d74ae20a380146880289e6eed09c41470641ffba0b309007f3619b39c40b81d1@group.calendar.google.com" scrolling="no"></iframe>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SSJ Staff Calendar - Optimized</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        /* 1.65倍の拡大を維持しつつ、4週目以降が隠れない高さ（750px）に最適化 */
        .scale-wrapper {
            width: 100%;
            height: 100%;
            transform: scale(1.65);
            transform-origin: top left;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="scale-wrapper">

</body>
</html>

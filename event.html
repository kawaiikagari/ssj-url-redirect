<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SSJ Staff Calendar - Optimized</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 50%;
            height: 50%;
            overflow: hidden;
            background-color: #ffffff;
        }
        /* 1.65倍の拡大を維持しつつ、4週目以降が隠れない高さ（750px）に最適化 */
        .scale-wrapper {
            width: 50%;
            height: 50%;
            transform: scale(1.65);
            transform-origin: top left;
        }
        iframe {
            width: 50%;
            height: 50%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="scale-wrapper">
        <iframe src="https://calendar.google.com/calendar/u/0/embed?color=%2342d692&color=%23cd74e6&color=%23f83a22&src=10bbcc5e95ad3ebc84ca5245eabc6a817e21cc54898d0ebe61a9ea202e38442a@group.calendar.google.com&src=af7b89fce476be7722a861547e3ff97399c9035ea2695e2013e3fec631902cad@group.calendar.google.com&src=d74ae20a380146880289e6eed09c41470641ffba0b309007f3619b39c40b81d1@group.calendar.google.com" scrolling="no"></iframe>
    </div>
</body>
</html>
